<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Carreira Radial - BSI IFMG OB</title>
  <link rel="stylesheet" href="src/style.css">
  <!-- D3.js v7 CDN -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
  <div id="app">
    <!-- Main Container: Graph Canvas & Detail Panel -->
    <main class="main-content">
      <div id="graph-container">
        <svg id="radial-graph"></svg>

        <!-- Floating Eixos Filters (Top Center) -->
        <div class="floating-panel floating-top">
          <div id="eixos-filters" class="eixos-container"></div>
        </div>

        <!-- Floating Natureza Filters (Bottom Left) -->
        <div class="floating-panel floating-bottom-left">
          <div id="natureza-filters" class="eixos-container"></div>
        </div>

        <!-- Controls Overlay (Zoom, Reset, Navigation) -->
        <div class="canvas-controls">
          <button id="btn-zoom-in" title="Aumentar Zoom">+</button>
          <button id="btn-zoom-out" title="Diminuir Zoom">−</button>
          <button id="btn-reset" title="Resetar Visualização">↺</button>
          <div class="controls-divider"></div>
          <a id="btn-github" href="https://github.com/moimanu/system-information-radial-career-map" target="_blank"
            rel="noopener noreferrer" title="Repositório GitHub">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
            </svg>
          </a>
          <button id="btn-fullscreen" title="Tela Cheia (F11)">
            <svg id="icon-expand" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9" />
              <polyline points="9 21 3 21 3 15" />
              <line x1="21" y1="3" x2="14" y2="10" />
              <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
            <svg id="icon-compress" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              style="display:none">
              <polyline points="4 14 10 14 10 20" />
              <polyline points="20 10 14 10 14 4" />
              <line x1="14" y1="10" x2="21" y2="3" />
              <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
          </button>
          <a id="btn-back" href="index.html" title="Voltar ao Início">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </a>
        </div>
      </div>

      <!-- Side Drawer / Detail Panel -->
      <aside id="detail-panel" class="detail-panel hidden">
        <button id="close-panel" class="close-btn">&times;</button>
        <div class="panel-content">
          <span id="discipline-code" class="badge"></span>
          <h2 id="discipline-name"></h2>
          <div class="meta-info">
            <p><strong>Período:</strong> <span id="discipline-period"></span>º Semestre</p>
            <p><strong>Eixo:</strong> <span id="discipline-eixo"></span></p>
            <p><strong>Natureza:</strong> <span id="discipline-natureza"></span></p>
            <p><strong>Metodologia:</strong> <span id="discipline-metodologia"></span></p>
            <p><strong>Carga Horária:</strong> <span id="discipline-ch"></span>h (Teórica: <span
                id="ch-teorica"></span>h | Prática: <span id="ch-pratica"></span>h)</p>
          </div>

          <div class="tab-section">
            <h3>Ementa</h3>
            <p id="discipline-ementa"></p>
          </div>

          <div class="tab-section">
            <h3>Objetivos</h3>
            <p id="discipline-objetivos"></p>
          </div>

          <div class="tab-section">
            <h3>Bibliografia Básica</h3>
            <p id="discipline-bib-basica"></p>
          </div>

          <div class="tab-section">
            <h3>Bibliografia Complementar</h3>
            <p id="discipline-bib-comp"></p>
          </div>
        </div>
      </aside>
    </main>
    <!-- Profession Selection Popup Modal -->
    <div id="profession-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <button id="close-profession-modal" class="modal-close-btn">&times;</button>
        <div class="modal-header">
          <h3>Selecionar Profissão / Perfil</h3>
        </div>
        <p class="modal-subtitle">Escolha uma profissão para visualizar o mapa de carreira correspondente:</p>
        <div class="modal-body">
          <div id="custom-dropdown" class="custom-dropdown">
            <button type="button" id="dropdown-trigger" class="dropdown-trigger">
              <span id="dropdown-label">Selecione uma profissão</span>
              <span class="dropdown-arrow">▼</span>
            </button>
            <div id="dropdown-options" class="dropdown-options hidden"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-confirm-profession" class="btn-primary">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>

</html>
